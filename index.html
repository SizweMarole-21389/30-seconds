<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 Minutes</title>
<style>
  :root { --bg:#14102b; --card:#fff8e7; --ink:#2a2140; --accent:#ff7a3d; --good:#2fbf71; --mute:#9d94c4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:#fff; font-family:system-ui,Segoe UI,Roboto,sans-serif; display:flex; justify-content:center; }
  main { width:100%; max-width:460px; padding:20px 16px 40px; }
  h1 { text-align:center; font-size:2rem; margin:8px 0 4px; }
  h1 span { color:var(--accent); }
  .sub { text-align:center; color:var(--mute); margin:0 0 16px; }
  label { display:block; margin:12px 0 4px; color:var(--mute); font-size:.9rem; }
  input, select { width:100%; padding:12px; border-radius:10px; border:0; font-size:1rem; }
  button { width:100%; margin-top:14px; padding:14px; font-size:1.1rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; border:2px solid var(--mute); color:var(--mute); }
  button:disabled { opacity:.5; }
  .rules { background:#1f1a3d; border-radius:12px; padding:12px 16px; margin-top:18px; font-size:.92rem; line-height:1.5; color:#d6d0ee; }
  .or { text-align:center; color:var(--mute); margin:18px 0 0; }
  .err { color:#ff8a8a; text-align:center; min-height:1.2em; margin-top:10px; }
  .bar { display:flex; justify-content:space-between; font-size:.95rem; color:var(--mute); margin-bottom:10px; gap:8px; }
  .bar b { color:#fff; }
  .timer { text-align:center; font-size:4rem; font-weight:800; margin:4px 0 10px; font-variant-numeric:tabular-nums; }
  .timer.low { color:#ff5a5a; }
  .track { height:8px; background:#2b2552; border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .fill { height:100%; background:var(--accent); }
  .cardbox { background:var(--card); color:var(--ink); border-radius:16px; padding:8px; }
  .item { display:flex; align-items:center; gap:12px; width:100%; margin:0; padding:14px; font-size:1.2rem; font-weight:600; text-align:left; background:transparent; color:var(--ink); border-radius:10px; border-bottom:1px solid #e8dfc4; }
  .item:last-child { border-bottom:0; }
  .item .dot { width:26px; height:26px; border-radius:50%; border:3px solid var(--accent); flex:none; }
  .item.got { background:#d8f5e5; text-decoration:line-through; color:#555; }
  .item.got .dot { background:var(--good); border-color:var(--good); }
  .big { text-align:center; font-size:1.3rem; margin:18px 0 8px; }
  .score { text-align:center; font-size:3rem; font-weight:800; color:var(--accent); }
  .code { text-align:center; font-size:3rem; letter-spacing:.3em; font-weight:800; color:var(--accent); margin:6px 0; }
  .guess { text-align:center; background:#1f1a3d; border-radius:16px; padding:28px 16px; font-size:1.3rem; line-height:1.5; }
  .guess .n { font-size:3rem; font-weight:800; color:var(--good); display:block; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  td { padding:10px; background:#1f1a3d; font-size:1.1rem; }
  tr + tr td { border-top:2px solid var(--bg); }
  td:last-child { text-align:right; font-weight:800; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>2 <span>Minutes</span></h1>
  <p class="sub">Describe it. Don't say it. Beat the clock.</p>
  <div id="net" style="display:none;background:#5a2a2a;color:#ffd0d0;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center"></div>
  <div id="app"></div>
</main>

/* ---------- game engine (runs in the host's browser) ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const SEEN_KEY = 'sec30-seen';
function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); }
}
function saveSeen(set) {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch (e) { /* storage blocked */ }
}
// Fresh deck of items this browser has not shown yet; starts over once everything has been used.
function freshDeck() {
  const seen = loadSeen();
  let pool = ITEMS.filter(w => !seen.has(w));
  if (pool.length < 5) { seen.clear(); saveSeen(seen); pool = [...ITEMS]; }
  return shuffle(pool);
}
function draw() {
  if (room.deck.length < 5) room.deck = freshDeck();
  const card = room.deck.splice(0, 5);
  const seen = loadSeen();
  card.forEach(w => seen.add(w));
  saveSeen(seen);
  return card;
}
function finishTurn() {
  if (room.phase !== 'play') return;
  room.players[room.turn % 2].score += room.got.filter(Boolean).length;
  room.phase = 'result';
}
function tick() {
  if (room && room.phase === 'play' && Date.now() >= room.endsAt) finishTurn();
}
function view(me) {
  const d = room.turn % 2;
  const showCard = room.phase === 'result' || (room.phase === 'play' && me === d);
  return {
    code: room.code, phase: room.phase, rounds: room.rounds, turn: room.turn,
    round: Math.floor(room.turn / 2) + 1,
    lastTurn: room.turn + 1 >= room.rounds * 2,
    me, describer: d,
    players: room.players.map(p => ({ name: p.name, score: p.score })),
    card: showCard ? room.card : null,
    got: room.phase === 'play' || room.phase === 'result' ? room.got : null,
    gotCount: room.got.filter(Boolean).length,
    remainingMs: room.phase === 'play' ? Math.max(0, room.endsAt - Date.now()) : 0,
  };
}
function apply(me, type, i) {
  tick();
  const d = room.turn % 2;
  if (type === 'start' && room.phase === 'ready' && me === d) {
    room.card = draw();
    room.got = room.card.map(() => false);
    room.endsAt = Date.now() + TURN_MS;
    room.phase = 'play';
  } else if (type === 'toggle' && room.phase === 'play' && me === d) {
    if (i >= 0 && i < 5) room.got[i] = !room.got[i];
  } else if (type === 'done' && room.phase === 'play' && me === d) {
    finishTurn();
  } else if (type === 'next' && room.phase === 'result') {
    room.turn++;
    room.phase = room.turn >= room.rounds * 2 ? 'end' : 'ready';
  } else if (type === 'again' && room.phase === 'end') {
    room.players.forEach(p => { p.score = 0; });
    room.turn = 0;
    room.deck = freshDeck();
    room.phase = 'ready';
  }
  publish();
}
function publish() {
  setState(view(0));
  if (guestId) send(topicBase + '/to1/' + guestId, { t: 'state', s: view(1) });
}

/* ---------- networking (public MQTT relay over secure WebSocket) ---------- */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const base = c => `sec30/v1/${c}`;
let mq = null, topicBase = '', guestId = null, myCid = '';
let lastGuestSeen = 0, lastHostSeen = 0, lastSeq = 0, seq = 0;

const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
function cleanName(s) { return String(s || '').replace(/[<>]/g, '').trim().slice(0, 16); }
function newCode() {
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c = '';
  for (let i = 0; i < 4; i++) c += letters[crypto.getRandomValues(new Uint32Array(1))[0] % letters.length];
  return c;
}
function setNet(msg) {
  const n = document.getElementById('net');
  n.textContent = msg; n.style.display = msg ? 'block' : 'none';
}
function send(topic, obj, qos = 0, retain = false) {
  if (mq && mq.connected) mq.publish(topic, JSON.stringify(obj), { qos, retain });
}
function connectBroker(will, onReady, onFail, i = 0) {
  if (i >= BROKERS.length) return onFail();
  const c = mqtt.connect(BROKERS[i], { connectTimeout: 6000, reconnectPeriod: 2000, clientId: 'sec30_' + rid(), will });
  let done = false;
  const t = setTimeout(() => { if (!done) { c.end(true); connectBroker(will, onReady, onFail, i + 1); } }, 7000);
  c.once('connect', () => { done = true; clearTimeout(t); mq = c; onReady(); });
  c.on('offline', () => { if (done) setNet('Connection problem, trying to reconnect...'); });
  c.on('connect', () => { if (done) setNet(''); });
}

function hostGame(name, rounds, fail, tries = 0) {
  const code = newCode();
  topicBase = base(code);
  let id = rid(), taken = false, started = false;
  connectBroker({ topic: topicBase + '/host', payload: '', retain: true, qos: 1 }, () => {
    mq.on('message', (topic, payload) => {
      let m; try { m = JSON.parse(payload.toString() || 'null'); } catch (e) { return; }
      if (!m) return;
      if (topic === topicBase + '/host') { if (m.id !== id && !started) taken = true; return; }
      if (!started || !room) return;
      if (topic === topicBase + '/join') {
        if (guestId && guestId !== m.cid) return send(topicBase + '/hello/' + m.cid, { t: 'full' }, 1);
        guestId = m.cid; lastGuestSeen = Date.now();
        if (room.players.length < 2) {
          room.players.push({ name: cleanName(m.name) || 'Player 2', score: 0 });
          room.phase = 'ready';
        }
        publish();
      } else if (topic === topicBase + '/to0' && m.cid === guestId) {
        lastGuestSeen = Date.now();
        if (m.type && m.seq > lastSeq && room.players.length === 2) { lastSeq = m.seq; apply(1, m.type, +m.i); }
      }
    });
    mq.subscribe([topicBase + '/host', topicBase + '/join', topicBase + '/to0'], { qos: 1 });
    setTimeout(() => {
      if (taken) {
        mq.end(true);
        return tries < 5 ? hostGame(name, rounds, fail, tries + 1) : fail('Could not start a game. Try again.');
      }
      started = true;
      send(topicBase + '/host', { id }, 1, true);
      isHost = true;
      room = { code, rounds, turn: 0, phase: 'lobby', deck: freshDeck(), card: [], got: [], endsAt: 0,
               players: [{ name: cleanName(name) || 'Player 1', score: 0 }] };
      publish();
    }, 900);
  }, () => fail('Could not reach the game relay. Check your internet and try again.'));

  setInterval(() => {
    if (!room) return;
    const was = room.phase; tick();
    if (was !== room.phase || room.phase === 'play') publish();
  }, 500);
  setInterval(() => {
    if (!room || !guestId) return;
    publish();
    setNet(Date.now() - lastGuestSeen > 20000 ? 'Your friend seems to have disconnected.' : '');
  }, 2000);
}

function joinGame(name, code, fail) {
  code = code.toUpperCase().trim();
  if (code.length !== 4) return fail('Enter the 4 letter code.');
  topicBase = base(code); myCid = rid();
  let joined = false;
  connectBroker(null, () => {
    mq.on('message', (topic, payload) => {
      let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (topic === topicBase + '/hello/' + myCid && m.t === 'full') { joined = true; return fail('That game is already full.'); }
      if (topic === topicBase + '/to1/' + myCid && m.t === 'state') {
        joined = true; lastHostSeen = Date.now(); setNet(''); setState(m.s);
      }
    });
    mq.subscribe([topicBase + '/to1/' + myCid, topicBase + '/hello/' + myCid], { qos: 1 }, () => {
      let attempts = 0;
      const tryJoin = () => {
        if (joined) return;
        if (attempts++ >= 5) return fail('No game with that code, or your friend closed the page.');
        send(topicBase + '/join', { cid: myCid, name: cleanName(name) }, 1);
        setTimeout(tryJoin, 2500);
      };
      tryJoin();
    });
    setInterval(() => {
      if (!joined) return;
      send(topicBase + '/to0', { cid: myCid, ping: 1 });
      if (Date.now() - lastHostSeen > 12000) setNet('Lost contact with the host. Waiting...');
    }, 3000);
  }, () => fail('Could not reach the game relay. Check your internet and try again.'));
}

function renderHome(err) {

  const name = el('input', { placeholder: 'Your name', maxLength: 16 });

  const rounds = el('select', {}, ...[3, 5, 8, 10].map(n => el('option', { value: n, textContent: n, selected: n === 5 })));
  const joinCode = el('input', { placeholder: 'Game code', maxLength: 4, value: urlCode, style: 'text-transform:uppercase;letter-spacing:.3em;text-align:center' });
  const errBox = txt('div', 'err', err || '');
  const fail = m => { errBox.textContent = m; };
  const remember = () => { try { localStorage.setItem('name', name.value); } catch (e) { /* ignore */ } };
  const create = el('button', { textContent: 'Start a new game', onclick: () => {
    errBox.textContent = 'Starting...'; remember(); hostGame(name.value, +rounds.value, fail);
  } });
  const join = el('button', { textContent: 'Join a game', onclick: () => {
    errBox.textContent = 'Connecting...'; remember(); joinGame(name.value, joinCode.value, fail);
  } });
  app.replaceChildren(
    txt('label', '', 'Your name'), name,
    urlCode ? txt('p', 'or', 'You were invited. Enter your name and join.')
            : el('div', {}, txt('label', '', 'Rounds each'), rounds, create, txt('p', 'or', 'or join a friend')),
    txt('label', '', 'Game code'), joinCode, join, errBox,
    txt('div', 'rules', 'One of you starts a game and sends the link or the 4 letter code. You both play on your own phone or laptop, and you talk on a call. Take turns: the describer sees 5 names or things and has 2 minutes to describe them without saying the words. The other person guesses out loud. The describer taps each one that was guessed. 1 point each. The person who started the game must keep the page open. Game messages pass through a free public relay, so do not type anything private as your name.')
  );
}

function scoreBar() {
  const [a, b] = st.players;
  return el('div', { className: 'bar' },
    txt('span', '', `Round ${Math.min(st.round, st.rounds)} of ${st.rounds}`),
    el('span', {}, `${a.name} `, el('b', { textContent: a.score }), ` | ${b ? b.name : '?'} `, el('b', { textContent: b ? b.score : 0 })));
}

function act(type, extra) {
  if (isHost) apply(0, type, extra ? extra.i : 0);
  else send(topicBase + '/to0', { cid: myCid, type, i: extra ? extra.i : 0, seq: ++seq }, 1);
}

function render() {
  const me = st.me;
  const d = st.players[st.describer];
  const iAmDescriber = st.describer === me;

  if (st.phase === 'lobby') {
    const link = `${location.origin}${location.pathname}?code=${st.code}`;
    const copy = el('button', { textContent: 'Copy invite link', onclick: async () => {
      try { await navigator.clipboard.writeText(link); copy.textContent = 'Copied. Send it to her.'; } catch { copy.textContent = link; }
    } });
    return app.replaceChildren(
      txt('p', 'big', 'Waiting for your friend'), txt('div', 'code', st.code),
      txt('p', 'sub', 'Send her the link below, or tell her the code. Keep this page open.'), copy);
  }

  if (st.phase === 'ready') {
    const body = iAmDescriber
      ? [txt('p', 'big', `${d.name}, you're describing.`), txt('p', 'sub', 'Your friend guesses out loud. Press start when you are both ready.'),
         el('button', { textContent: 'Start the 2 minutes', onclick: () => act('start') })]
      : [txt('p', 'big', `${d.name} is describing.`), txt('p', 'sub', 'Get ready to guess. The words show on their screen, not yours.')];
    return app.replaceChildren(scoreBar(), ...body);
  }

  if (st.phase === 'play') {
    const clock = el('div', { className: 'timer', id: 'clock' });
    const fill = el('div', { className: 'fill', id: 'fill' });
    const head = [scoreBar(), clock, el('div', { className: 'track' }, fill)];
    if (iAmDescriber) {
      const box = el('div', { className: 'cardbox' }, st.card.map((c, i) =>
        el('button', { className: 'item' + (st.got[i] ? ' got' : ''), onclick: () => act('toggle', { i }) },
          el('span', { className: 'dot' }), txt('span', '', c))));
      return app.replaceChildren(...head, box, el('button', { className: 'ghost', textContent: 'Done early', onclick: () => act('done') }));
    }
    return app.replaceChildren(...head, el('div', { className: 'guess' },
      `${d.name} is describing. Guess out loud!`, el('span', { className: 'n', textContent: `${st.gotCount}/5` }), 'guessed so far'));
  }

  if (st.phase === 'result') {
    const rows = st.card.map((c, i) => el('tr', {}, txt('td', '', c), txt('td', '', st.got[i] ? '✓' : '✗')));
    return app.replaceChildren(scoreBar(), txt('p', 'big', `${d.name}'s turn`), txt('div', 'score', `+${st.gotCount}`),
      el('table', {}, ...rows),
      el('button', { textContent: st.lastTurn ? 'See final result' : 'Next turn', onclick: () => act('next') }));
  }

  if (st.phase === 'end') {
    const [a, b] = st.players;
    const w = a.score === b.score ? "It's a draw!" : `${a.score > b.score ? a.name : b.name} wins!`;
    return app.replaceChildren(txt('p', 'big', 'Game over'), txt('div', 'score', w),
      el('table', {}, ...st.players.map(p => el('tr', {}, txt('td', '', p.name), txt('td', '', p.score)))),
      el('button', { textContent: 'Play again', onclick: () => act('again') }));
  }
}

function setState(s) {
  st = s; recvAt = Date.now();
  const key = JSON.stringify({ ...s, remainingMs: 0, gotCount: s.phase === 'play' ? 0 : s.gotCount });
  if (key !== sig) { sig = key; render(); }
}

setInterval(() => {
  if (!st || st.phase !== 'play') return;
  const left = Math.max(0, st.remainingMs - (Date.now() - recvAt));
  const c = document.getElementById('clock'), f = document.getElementById('fill');
  if (c) { const t = Math.ceil(left / 1000); c.textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); c.classList.toggle('low', left <= 5000); }
  if (f) f.style.width = (left / (TURN_MS / 100)) + '%';
  const g = document.querySelector('.guess .n');
  if (g) g.textContent = `${st.gotCount}/5`;
}, 200);

renderHome();
</script>
</body>
</html>
